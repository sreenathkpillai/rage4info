<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Communicate iframe height to parent (WordPress)
      let resizeTimeout;
      function postHeight() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const root = document.getElementById('root');
          const height = root ? root.scrollHeight : document.body.scrollHeight;
          window.parent.postMessage({ type: 'resize', height: height }, '*');
        }, 50);
      }
      window.addEventListener('load', () => {
        postHeight();
        const root = document.getElementById('root');
        if (root) {
          new MutationObserver(postHeight).observe(root, { childList: true, subtree: true });
          new ResizeObserver(postHeight).observe(root);
        }
      });
      // Catch route changes
      window.addEventListener('popstate', postHeight);
    </script>
  </body>
</html>
